name: Harmonic simulation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '22.04'
            ros: humble
            codename: jammy
          - ubuntu: '24.04'
            ros: jazzy
            codename: noble
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS base
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg sudo build-essential cmake xvfb xauth libgl1-mesa-dri libegl1
          curl --fail --location https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          printf 'deb [arch=amd64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu %s main\n' '${{ matrix.codename }}' > /etc/apt/sources.list.d/ros2.list
          apt-get update
          apt-get install -y --no-install-recommends ros-${{ matrix.ros }}-ros-base
      - name: Install and check the module dependencies
        run: |
          printf 'Y\n' | bash scripts/install_dependencies.sh --install
          bash scripts/install_dependencies.sh --check
      - name: Build and run resource tests
        run: |
          source scripts/setup_env.bash
          colcon build --symlink-install --executor sequential
          source install/local_setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Check sensors, transforms, and driving with software rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          source scripts/setup_env.bash
          xvfb-run -a python3 scripts/smoke_test.py --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-${{ matrix.ros }}
          path: |
            log/smoke/
            build/sim_bringup/test_results/
